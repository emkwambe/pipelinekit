table: orders
version: "1.0.0"
description: "Orders table contract — postgres-to-duckdb blueprint"
columns:
  - name: order_id
    type: integer
    nullable: false
    unique: true
  - name: customer_id
    type: integer
    nullable: false
  - name: status
    type: varchar
    nullable: false
    accepted_values: [pending, processing, shipped, delivered, cancelled]
  - name: amount
    type: integer
    nullable: false
  - name: created_at
    type: timestamp
    nullable: false
quality:
  row_count_min: 1
  freshness_hours: 24
