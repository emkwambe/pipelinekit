source:
  type: postgres
  host: "${POSTGRES_HOST}"
  port: 5432
  user: "${POSTGRES_USER}"
  password: "${POSTGRES_PASSWORD}"
  database: "${POSTGRES_DB}"
  tables:
    - orders
    - customers

destination:
  type: duckdb
  path: "${DUCKDB_PATH:-./pipeline.duckdb}"

pipeline:
  write_disposition: replace
  batch_size: 10000
