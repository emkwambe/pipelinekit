version: 2
models:
  - name: stg_postgres__orders
    description: "Staged orders from PostgreSQL. One row per order."
    columns:
      - name: order_id
        description: "Primary key — unique identifier for each order"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to stg_postgres__customers"
        tests:
          - not_null
      - name: status
        description: "Current order status"
        tests:
          - not_null
          - accepted_values:
              values: ['pending', 'processing', 'shipped', 'delivered', 'cancelled']
      - name: amount
        description: "Order amount in cents (integer)"
        tests:
          - not_null
      - name: created_at
        description: "UTC timestamp when order was created"
        tests:
          - not_null

  - name: stg_postgres__customers
    description: "Staged customers from PostgreSQL. One row per customer."
    columns:
      - name: customer_id
        description: "Primary key — unique identifier for each customer"
        tests:
          - unique
          - not_null
      - name: email
        description: "Customer email address — must be unique"
        tests:
          - unique
          - not_null
      - name: created_at
        description: "UTC timestamp when customer account was created"
        tests:
          - not_null
