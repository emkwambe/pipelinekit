version: 2
models:
  - name: stg_postgres__orders
    description: "Staged orders from PostgreSQL via dlt. One row per order."
    columns:
      - name: order_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to customers"
        tests:
          - not_null
      - name: status
        description: "Order status"
        tests:
          - not_null
          - accepted_values:
              values: [pending, processing, shipped, delivered, cancelled]
      - name: amount
        description: "Order amount"
        tests:
          - not_null
      - name: created_at
        description: "Order creation timestamp"
        tests:
          - not_null

  - name: stg_postgres__customers
    description: "Staged customers from PostgreSQL via dlt. One row per customer."
    columns:
      - name: customer_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: email
        description: "Customer email"
        tests:
          - not_null
      - name: created_at
        description: "Account creation timestamp"
        tests:
          - not_null
