version: 2
sources:
  - name: pipelinekit_pipeline_raw
    description: "Raw data loaded by dlt from PostgreSQL"
    schema: pipelinekit_pipeline_raw
    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    loaded_at_field: _loaded_at
    tables:
      - name: orders
        description: "Orders extracted from PostgreSQL"
        columns:
          - name: order_id
            description: "Primary key"
          - name: customer_id
            description: "Foreign key to customers"
          - name: status
            description: "Order status"
          - name: amount
            description: "Order amount"
          - name: created_at
            description: "Order creation timestamp"
      - name: customers
        description: "Customers extracted from PostgreSQL"
        columns:
          - name: customer_id
            description: "Primary key"
          - name: email
            description: "Customer email"
          - name: created_at
            description: "Account creation timestamp"
